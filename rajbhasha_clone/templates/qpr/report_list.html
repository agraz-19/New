{% extends "master.html" %}
{% load static %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Report List</h4>
        <div>
            <a href="{% url 'qpr_form' %}" class="btn btn-outline-secondary me-2">
                Fill New Report
            </a>
            <a href="{% url 'qpr_user_dashboard' %}" class="btn btn-outline-primary">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="table-light">
                        <tr>
                            <th>Office Name</th>
                            <th>Code</th>
                            <th>Region</th>
                            <th>Quarter</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
const API_URL = "/api/records";

// Function to mask sensitive fields
function maskSensitiveData(value) {
    if (!value || value === '-') return '-';
    const valueStr = String(value);
    if (valueStr.length <= 2) return valueStr;
    return valueStr.charAt(0) + '*'.repeat(valueStr.length - 2) + valueStr.charAt(valueStr.length - 1);
}

async function loadList() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No records found</td></tr>';
            return;
        }

        data.forEach(r => {
            const tr = document.createElement('tr');

            const status = r.status === 'Draft'
                ? '<span class="badge bg-primary">Draft</span>'
                : '<span class="badge bg-success">Submitted</span>';

            let actionButtons = '';

            if (r.status === 'Draft') {
                actionButtons = `<button class="btn btn-sm btn-outline-warning" onclick="event.stopPropagation(); edit(${r.id})">Edit</button>`;
            } else if (r.edit_approved) {
                actionButtons = `<button class="btn btn-sm btn-outline-warning" onclick="event.stopPropagation(); edit(${r.id})">Edit</button>`;
            } else {
                actionButtons = `<button class="btn btn-sm btn-outline-info" onclick="event.stopPropagation(); requestEdit(${r.id})">Request to Edit</button>`;
            }

            const maskedCode = maskSensitiveData(r.officeCode);

            tr.innerHTML = `
                <td>${r.officeName || '-'}</td>
                <td>${maskedCode}</td>
                <td>${r.region || '-'}</td>
                <td>${r.quarter || '-'}</td>
                <td>${status}</td>
                <td>
                    ${actionButtons}
                    <button class="btn btn-sm btn-outline-primary ms-1" onclick="view(${r.id})">View</button>
                </td>
            `;

            tr.addEventListener('click', () => {
                if (r.status === 'Submitted') view(r.id);
            });

            tbody.appendChild(tr);
        });

    } catch (err) {
        console.error(err);
    }
}

function view(id) {
    fetch(`/api/records/${id}/`)
        .then(res => res.json())
        .then(record => {
            if (record.can_edit) {
                localStorage.setItem('editRecordId', String(id));
                window.location.href = "{% url 'qpr_form' %}";
            } else {
                window.location.href = `/qpr/reports/${id}/`;
            }
        })
        .catch(err => {
            console.error(err);
            window.location.href = `/qpr/reports/${id}/`;
        });
}

function edit(id) {
    localStorage.setItem('editRecordId', String(id));
    window.location.href = "{% url 'qpr_form' %}";
}

function requestEdit(id) {
    const reason = prompt("Please enter the reason for requesting to edit this report:");
    if (reason === null) return;

    if (!reason.trim()) {
        alert("Please provide a reason for your request");
        return;
    }

    fetch(`/api/request-edit/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            record_id: id,
            reason: reason
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            alert("Request sent successfully!");
            loadList();
        } else {
            alert("Error: " + (data.error || "Failed"));
        }
    })
    .catch(err => {
        console.error(err);
        alert("Failed to send request");
    });
}

window.addEventListener('DOMContentLoaded', loadList);
</script>

{% endblock %}
