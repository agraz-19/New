{% extends "master.html" %}
{% load static %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Report Detail</h4>
        <div>
            <a href="{% url 'report_list' %}" class="btn btn-outline-secondary">
                ← Back to Report List
            </a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body" id="reportContainer">
            <div class="text-center text-muted">
                Loading report...
            </div>
        </div>
    </div>

</div>

<script>
const pathParts = window.location.pathname.split('/');
const recordId = pathParts[pathParts.length - 2];

async function loadReport() {
    try {
        const res = await fetch(`/api/records/${recordId}/`);
        const data = await res.json();

        const container = document.getElementById("reportContainer");

        if (!data || data.error) {
            container.innerHTML = "<div class='text-danger text-center'>Failed to load report</div>";
            return;
        }

        container.innerHTML = `
            <h5 class="mb-3">General Information</h5>
            <p><strong>Office Name:</strong> ${data.officeName || '-'}</p>
            <p><strong>Office Code:</strong> ${data.officeCode || '-'}</p>
            <p><strong>Region:</strong> ${data.region || '-'}</p>
            <p><strong>Quarter:</strong> ${data.quarter || '-'}</p>
            <p><strong>Status:</strong> ${data.status || '-'}</p>

            <hr>

            <h5 class="mt-4">Section 1</h5>
            <p>Total Files: ${data.s1_total || 0}</p>
            <p>Files in Hindi: ${data.s1_hindi || 0}</p>

            <h5 class="mt-4">Section 2</h5>
            <p>Meetings: ${data.s2_meetings || 0}</p>
            <p>Minutes in Hindi: ${data.s2_minutes || 0}</p>

            <h5 class="mt-4">Section 3</h5>
            <p>Total Documents: ${data.s3_total || 0}</p>
            <p>Bilingual: ${data.s3_bilingual || 0}</p>

            <h5 class="mt-4">Section 4</h5>
            <p>Letters Received: ${data.s4_total || 0}</p>

            <h5 class="mt-4">Section 5</h5>
            <p>Letters (Region A): ${data.s5_total || 0}</p>

            <h5 class="mt-4">Section 6</h5>
            <p>Region A Total: ${data.s6_a_total || 0}</p>

            <h5 class="mt-4">Section 7</h5>
            <p>Notings in Hindi: ${data.s7_hindi || 0}</p>

            <h5 class="mt-4">Section 8</h5>
            <p>Workshops: ${data.s8_workshops || 0}</p>

            <h5 class="mt-4">Section 9</h5>
            <p>Meeting Date: ${data.s9_date || '-'}</p>

            <h5 class="mt-4">Section 10</h5>
            <p>Advisory Meeting Date: ${data.s10_date || '-'}</p>

            <h5 class="mt-4">Achievements</h5>
            <p>${data.s12_1 || '-'}</p>
            <p>${data.s12_2 || '-'}</p>
            <p>${data.s12_3 || '-'}</p>
        `;

    } catch (error) {
        console.error(error);
        document.getElementById("reportContainer").innerHTML =
            "<div class='text-danger text-center'>Error loading report</div>";
    }
}

window.addEventListener("DOMContentLoaded", loadReport);
</script>

{% endblock %}
