{% extends "master.html" %}
{% load static %}
{% load translate_tags %}

{% block title %}{{ "Certificate"|t:current_lang }}{% endblock %}

{% block extra_css %}
<style>
    .certificate-loading {
        max-width: 600px;
        margin: 150px auto;
        padding: 40px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

    .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #0066cc;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .loading-text {
        color: #333;
        font-size: 16px;
        margin-top: 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="certificate-loading">
    <div class="spinner"></div>
    <div class="loading-text">{{ "Loading Certificate..."|t:current_lang }}</div>
</div>

<script>
// Redirect to certificate display after a brief moment
setTimeout(function() {
    window.location.replace(window.location.href.replace('/form/', '/display/'));
}, 500);
</script>
{% endblock %}
