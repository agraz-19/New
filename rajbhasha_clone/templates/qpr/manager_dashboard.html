{% extends "master.html" %}
{% load static %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    .dashboard-container {
        margin-top: 30px;
    }
    .dashboard-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
    }
    .card-title {
        color: #2c5a86;
        font-weight: bold;
        margin-bottom: 15px;
    }
</style>

<div class="container dashboard-container">

    <div class="dashboard-card">
        <h3><i class="fas fa-users"></i> Manager Dashboard</h3>
        <p class="text-muted">View employee QPR submissions and manage requests</p>
    </div>

    <div class="dashboard-card">
        <h5>Employee Overview</h5>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Employee Code</th>
                    <th>Name</th>
                    <th>QPR Status</th>
                </tr>
            </thead>
            <tbody>
                {% for emp in employees %}
                <tr>
                    <td>{{ emp.employee_code }}</td>
                    <td>{{ emp.name }}</td>
                    <td>{{ emp.qpr_status }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

{% endblock %}
